<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ética y Deontología — Manifiesto de Identidad Ética</title>
<style>
  :root{
    --azul:#1f3864;--azul-medio:#2c5f8a;--azul-claro:#5b9bd5;
    --naranja:#e08a2c;--ambar:#e0a52c;--morado:#8e44ad;--rojo:#c0392b;--verde:#2e8b57;
    --tinta:#20303f;--papel:#f4f6fa;--tarjeta:#ffffff;--linea:#d8e0ec;
    --sombra:0 12px 44px rgba(20,40,70,.16);
  }
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--papel:#0f1826;--tarjeta:#16233a;--tinta:#e8eef7;--linea:#2a3b57;--sombra:0 12px 44px rgba(0,0,0,.5);}}
  :root[data-theme="dark"]{--papel:#0f1826;--tarjeta:#16233a;--tinta:#e8eef7;--linea:#2a3b57;--sombra:0 12px 44px rgba(0,0,0,.5);}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;background:var(--papel);color:var(--tinta);overflow:hidden}
  #deck{position:relative;width:100vw;height:100vh;overflow:hidden}
  .slide{position:absolute;inset:0;display:flex;flex-direction:column;padding:clamp(24px,4vw,68px);opacity:0;visibility:hidden;transform:translateX(40px) scale(.98);transition:opacity .5s ease, transform .5s ease, visibility .5s;overflow-y:auto}
  .slide.active{opacity:1;visibility:visible;transform:none;z-index:2}
  .slide.prev{transform:translateX(-40px) scale(.98)}
  /* ---- TITLE ---- */
  .title-slide{justify-content:center;background:radial-gradient(1200px 600px at 12% -10%, rgba(224,138,44,.22), transparent 60%),linear-gradient(135deg, var(--azul) 0%, #142744 60%, #0d1b30 100%);color:#fff}
  .title-slide .eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:clamp(.75rem,1.4vw,1rem);letter-spacing:.22em;text-transform:uppercase;color:var(--ambar);font-weight:700;margin-bottom:20px}
  .title-slide .eyebrow::before{content:"";width:38px;height:3px;background:var(--naranja);border-radius:3px}
  .title-slide h1{font-size:clamp(2rem,6vw,4.4rem);line-height:1.04;font-weight:800;letter-spacing:-.01em;max-width:16ch}
  .title-slide h1 em{color:var(--ambar);font-style:normal}
  .title-slide .sub{margin-top:22px;font-size:clamp(1rem,2.2vw,1.45rem);color:#c9d6ea;font-weight:400;max-width:46ch}
  .title-slide .foot{margin-top:auto;display:flex;gap:26px;flex-wrap:wrap;font-size:clamp(.75rem,1.4vw,.95rem);color:#9fb4d1;padding-top:30px}
  .title-slide .foot b{color:#fff;font-weight:600}
  .bignum{position:absolute;right:clamp(10px,4vw,60px);top:clamp(6px,3vw,30px);font-size:clamp(7rem,26vw,22rem);font-weight:800;line-height:1;color:rgba(255,255,255,.05);z-index:0;pointer-events:none}
  /* cover extras */
  .cover-grid{position:relative;z-index:1;display:grid;grid-template-columns:1.3fr .9fr;gap:30px;align-items:center;height:100%}
  @media(max-width:820px){.cover-grid{grid-template-columns:1fr;gap:20px}}
  .cover-right{display:flex;flex-direction:column;gap:18px;align-items:flex-start}
  .cover-logo{background:#fff;border-radius:16px;padding:18px 22px;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:340px;width:100%}
  .cover-logo img{width:100%;height:auto;display:block}
  .cover-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:20px 22px;backdrop-filter:blur(4px);width:100%}
  .cover-card h3{color:var(--ambar);font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px;font-weight:700}
  .cover-card .who{display:flex;flex-direction:column;gap:9px}
  .cover-card .who div{display:flex;align-items:center;gap:10px;font-size:.98rem;color:#eaf1fb}
  .cover-card .who .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--naranja);color:#fff;font-size:.8rem;font-weight:700;display:grid;place-items:center}
  .cover-card .prof{margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.16);font-size:.95rem;color:#eaf1fb}
  .cover-card .prof b{color:var(--ambar);display:block;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px;font-weight:700}
  .cover-title h1{font-size:clamp(2rem,5.2vw,4rem)}
  /* ---- CONTENT ---- */
  .content-slide{background:var(--papel)}
  .c-head{display:flex;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap}
  .badge{flex:none;font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,var(--naranja),var(--ambar));padding:8px 15px;border-radius:999px;box-shadow:0 4px 14px rgba(224,138,44,.35)}
  .badge.blue{background:linear-gradient(135deg,var(--azul-medio),var(--azul-claro));box-shadow:0 4px 14px rgba(43,95,138,.35)}
  .c-head h2{font-size:clamp(1.4rem,3.2vw,2.4rem);font-weight:800;color:var(--azul);letter-spacing:-.01em;line-height:1.08}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .c-head h2{color:var(--azul-claro)}}
  :root[data-theme="dark"] .c-head h2{color:var(--azul-claro)}
  .lead{font-size:clamp(1.02rem,1.8vw,1.32rem);line-height:1.55;color:var(--tinta);max-width:80ch;margin-bottom:6px}
  .lead strong{color:var(--naranja)}
  /* main layout: big image left, content right */
  .layout{flex:1;display:grid;grid-template-columns:minmax(320px,42%) 1fr;gap:26px;align-items:stretch;min-height:0}
  .layout.rev{grid-template-columns:1fr minmax(320px,42%)}
  @media(max-width:860px){.layout,.layout.rev{grid-template-columns:1fr;gap:18px}}
  .hero-img{border-radius:18px;overflow:hidden;box-shadow:var(--sombra);border:1px solid var(--linea);background:linear-gradient(135deg,#0f1826,#1f3864);display:flex;align-items:center;justify-content:center;min-height:clamp(240px,42vh,520px)}
  .hero-img img{width:100%;height:100%;object-fit:cover;display:block}
  .hero-img.contain{padding:10px}
  .hero-img.contain img{object-fit:contain;border-radius:10px}
  .col{display:flex;flex-direction:column;gap:14px;justify-content:center;min-width:0}
  /* larger definition blocks */
  .deflist{display:flex;flex-direction:column;gap:12px}
  .defrow{background:var(--tarjeta);border:1px solid var(--linea);border-radius:14px;padding:16px 20px;box-shadow:var(--sombra);border-left:5px solid var(--accent,var(--ambar))}
  .defrow b{color:var(--azul);font-size:1.12rem}
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .defrow b{color:var(--azul-claro)}}
  :root[data-theme="dark"] .defrow b{color:var(--azul-claro)}
  .defrow .et{color:var(--naranja);font-weight:600;font-size:.85rem;font-style:italic;margin-left:6px}
  .defrow p{font-size:1rem;line-height:1.5;margin-top:5px;opacity:.9}
  .qbox{background:linear-gradient(135deg,var(--azul),#16294a);color:#fff;border-radius:14px;padding:20px 22px;box-shadow:var(--sombra)}
  .qbox p{font-size:1.12rem;line-height:1.5;font-style:italic}
  .qbox .who{margin-top:12px;color:var(--ambar);font-weight:600;font-size:.9rem}
  .bnr{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,rgba(224,138,44,.16),rgba(224,165,44,.08));border:1px dashed var(--naranja);border-radius:14px;padding:16px 20px;font-size:1.02rem;line-height:1.45}
  .bnr .k{flex:none;background:var(--naranja);color:#fff;font-weight:800;font-size:.74rem;letter-spacing:.1em;padding:7px 12px;border-radius:8px;text-transform:uppercase}
  .duo2{display:flex;flex-direction:column;gap:12px}
  .duo2 .box{background:var(--tarjeta);border:1px solid var(--linea);border-radius:14px;padding:17px 20px;box-shadow:var(--sombra)}
  .duo2 .box.dark{background:var(--azul);color:#fff;border:none}
  .duo2 .box h4{font-size:1.05rem;margin-bottom:7px;color:var(--naranja)}
  .duo2 .box.dark h4{color:var(--ambar)}
  .duo2 .box p{font-size:.98rem;line-height:1.5;opacity:.94}
  .stack{display:flex;flex-direction:column;gap:12px}
  .big-list{background:var(--tarjeta);border:1px solid var(--linea);border-radius:14px;padding:18px 22px;box-shadow:var(--sombra)}
  .big-list h3{color:var(--naranja);font-size:1.08rem;margin-bottom:12px;font-weight:700}
  .big-list ul{list-style:none;display:flex;flex-direction:column;gap:11px}
  .big-list li{padding-left:26px;position:relative;font-size:1.02rem;line-height:1.5}
  .big-list li::before{content:"";position:absolute;left:0;top:.55em;width:10px;height:10px;border-radius:3px;background:var(--ambar);transform:rotate(45deg)}
  /* philosophers timeline full-width under image */
  .tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .ph{background:var(--tarjeta);border:1px solid var(--linea);border-radius:12px;padding:14px;box-shadow:var(--sombra);border-top:4px solid var(--accent,var(--azul-claro))}
  .ph b{color:var(--azul);font-size:1rem;display:block}
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .ph b{color:var(--azul-claro)}}
  :root[data-theme="dark"] .ph b{color:var(--azul-claro)}
  .ph .yr{font-size:.76rem;color:var(--naranja);font-weight:600}
  .ph p{font-size:.9rem;line-height:1.4;margin-top:5px;opacity:.9}
  .ph .q{font-size:.84rem;font-style:italic;margin-top:6px;opacity:.75}
  .fal{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .fc{background:var(--tarjeta);border:1px solid var(--linea);border-radius:12px;padding:14px 16px;box-shadow:var(--sombra);border-left:4px solid var(--rojo)}
  .fc b{color:var(--rojo);font-size:.98rem}
  .fc p{font-size:.9rem;line-height:1.4;margin-top:3px;opacity:.88}
  .sl-row{display:grid;grid-template-columns:120px 1fr 1fr;gap:12px;align-items:stretch}
  @media(max-width:640px){.sl-row{grid-template-columns:1fr}}
  .sl-area{display:grid;place-items:center;background:var(--tarjeta);border:1px solid var(--linea);border-radius:13px;font-weight:700;color:var(--azul);font-size:1rem}
  .sl-dark{background:var(--azul);color:#fff;border-radius:13px;padding:14px 16px;font-size:.98rem;line-height:1.45}
  .sl-light{background:linear-gradient(135deg,var(--ambar),#f0c060);color:#5a3a10;border-radius:13px;padding:14px 16px;font-size:.98rem;line-height:1.45}
  .sl-dark b,.sl-light b{display:block;font-size:.7rem;letter-spacing:.09em;margin-bottom:4px}
  .sl-dark b{color:var(--ambar)}
  .pill-row{display:flex;flex-wrap:wrap;gap:11px}
  .pill{background:var(--tarjeta);border:1px solid var(--linea);border-radius:12px;padding:12px 16px;font-size:1rem;box-shadow:var(--sombra)}
  .pill b{color:var(--azul);font-weight:700}
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill b{color:var(--azul-claro)}}
  :root[data-theme="dark"] .pill b{color:var(--azul-claro)}
  .cita{font-size:.82rem;opacity:.6;font-style:italic;margin-top:6px}
  /* chrome */
  #progress{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,var(--naranja),var(--ambar));z-index:50;transition:width .4s ease;box-shadow:0 0 12px rgba(224,138,44,.6)}
  .nav-btn{position:fixed;top:50%;transform:translateY(-50%);z-index:40;width:46px;height:46px;border-radius:50%;border:1px solid var(--linea);background:var(--tarjeta);color:var(--azul);cursor:pointer;font-size:1.2rem;display:grid;place-items:center;box-shadow:var(--sombra);transition:.2s}
  .nav-btn:hover{background:var(--azul);color:#fff;transform:translateY(-50%) scale(1.08)}
  .nav-btn:disabled{opacity:.25;cursor:default;transform:translateY(-50%)}
  #prev{left:14px}#next{right:14px}
  #counter{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:40;background:var(--tarjeta);border:1px solid var(--linea);border-radius:999px;padding:8px 16px;font-size:.8rem;font-weight:600;color:var(--tinta);box-shadow:var(--sombra);display:flex;align-items:center;gap:12px}
  #counter .dots{display:flex;gap:5px}
  #counter .dot{width:7px;height:7px;border-radius:50%;background:var(--linea);cursor:pointer;transition:.2s}
  #counter .dot.on{background:var(--naranja);transform:scale(1.35)}
  #theme{position:fixed;top:12px;right:14px;z-index:40;background:var(--tarjeta);border:1px solid var(--linea);border-radius:999px;width:38px;height:38px;cursor:pointer;box-shadow:var(--sombra);font-size:1rem}
  .hint{position:fixed;bottom:14px;right:16px;z-index:40;font-size:.7rem;color:var(--tinta);opacity:.5}
  @media(max-width:640px){.hint{display:none}.nav-btn{width:38px;height:38px}}
</style>
</head>
<body>
<div id="progress"></div>
<button id="theme" title="Cambiar tema">🌓</button>
<div id="deck"></div>
<button class="nav-btn" id="prev" aria-label="Anterior">‹</button>
<button class="nav-btn" id="next" aria-label="Siguiente">›</button>
<div id="counter"><span id="cnum">1 / 1</span><span class="dots" id="dots"></span></div>
<div class="hint">← → o barra espaciadora para navegar</div>

/* ===== renderers ===== */
function defBlock(items){return `<div class="deflist">${items.map(i=>`<div class="defrow" style="--accent:${i.acc}"><b>${i.t}</b>${i.et?`<span class="et">${i.et}</span>`:''}<p>${i.d}</p></div>`).join('')}</div>`;}
function listBlock(l){return `<div class="big-list"><h3>${l.h}</h3><ul>${l.items.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;}
function duoBlock(d){return `<div class="duo2"><div class="box"><h4>${d.a.h}</h4><p>${d.a.d}</p></div><div class="box ${d.b.dark?'dark':''}"><h4>${d.b.h}</h4><p>${d.b.d}</p></div></div>`;}
function bannerBlock(b){return `<div class="bnr"><span class="k">${b.k}</span><span>${b.t}</span></div>`;}
function pillsBlock(p){return `<div class="pill-row">${p.map(x=>`<div class="pill">${x}</div>`).join('')}</div>`;}
function qBlock(q){return `<div class="qbox"><p>“${q.q}”</p><div class="who">${q.who}</div></div>`;}
function tlBlock(items){return `<div class="tl">${items.map(i=>`<div class="ph" style="--accent:${i.acc}"><b>${i.who}</b><span class="yr">${i.yr}</span><p>${i.idea}</p><div class="q">${i.q}</div></div>`).join('')}</div>`;}
function falBlock(items){return `<div class="fal">${items.map(i=>`<div class="fc"><b>${i.t}</b><p>${i.d}</p></div>`).join('')}</div>`;}
function slBlock(rows){return `<div class="stack">${rows.map(r=>`<div class="sl-row"><div class="sl-area">${r.area}</div><div class="sl-dark"><b>SOMBRA</b>${r.dark}</div><div class="sl-light"><b>LUZ</b>${r.light}</div></div>`).join('')}</div>`;}
function renderChunk(c){
  if(c.def)return defBlock(c.def);
  if(c.list)return listBlock(c.list);
  if(c.duo)return duoBlock(c.duo);
  if(c.banner)return bannerBlock(c.banner);
  if(c.pills)return pillsBlock(c.pills);
  if(c.q)return qBlock(c);
  if(c.timeline)return tlBlock(c.timeline);
  if(c.fal)return falBlock(c.fal);
  if(c.sl)return slBlock(c.sl);
  if(c.svg)return `<div class="hero-img contain" style="min-height:auto">${c.svg}</div>`;
  return '';
}
function heroImg(key,contain){const src=IMG[key];if(!src)return '';return `<div class="hero-img ${contain?'contain':''}"><img src="${src}" alt=""></div>`;}
function coverSlide(){
  return `<section class="slide title-slide">
    <div class="cover-grid">
      <div class="cover-title">
        <span class="eyebrow">HUM-010 · UCSUR · 2026-2</span>
        <h1>Manifiesto de <em>Identidad Ética</em></h1>
        <p class="sub">Recorrido por las cuatro sesiones del Módulo 1: conceptos, definiciones y las actividades que construyen el portafolio.</p>
      </div>
      <div class="cover-right">
        <div class="cover-logo"><img src="${LOGO}" alt="Universidad Científica del Sur"></div>
        <div class="cover-card">
          <h3>Equipo · Homeostasis</h3>
          <div class="who">
            <div><span class="n">1</span> Mateo Canaza, Axel Iván — Ingeniería Empresarial y de Sistemas</div>
            <div><span class="n">2</span> Ponte Tarazona, Christian Jesús — Nutrición</div>
            <div><span class="n">3</span> Manrique Marcelo, Israel — Ingeniería Empresarial y de Sistemas</div>
          </div>
          <div class="prof"><b>Docente</b>Adolfo Gustavo Tantaleán Valiente</div>
        </div>
      </div>
    </div>
  </section>`;
}
function renderSlide(s){
  if(s.type==='cover')return coverSlide();
  if(s.type==='title')return `<section class="slide title-slide">${s.n?`<div class="bignum">${s.n}</div>`:''}<div style="position:relative;z-index:1"><span class="eyebrow">${s.eyebrow}</span><h1>${s.h}</h1><p class="sub">${s.sub}</p></div><div class="foot">${s.foot.map(f=>`<span>${f}</span>`).join('')}</div></section>`;
  const head = `<div class="c-head"><span class="badge ${s.blue?'blue':''}">${s.badge}</span><h2>${s.h}</h2></div>`;
  const lead = s.lead?`<p class="lead">${s.lead}</p>`:'';
  const cita = s.cita?`<div class="cita">${s.cita}</div>`:'';
  if(s.wide){ // image full-width banner + content below
    return `<section class="slide content-slide">${head}${lead}<div class="hero-img ${s.contain?'contain':''}" style="min-height:clamp(160px,26vh,280px);margin-bottom:16px">${IMG[s.img]?`<img src="${IMG[s.img]}" alt="">`:''}</div>${(s.below||[]).map(renderChunk).join('')}${cita}</section>`;
  }
  const img = heroImg(s.img, s.contain);
  const col = `<div class="col">${(s.right||[]).map(renderChunk).join('')}${cita}</div>`;
  const layout = s.rev ? `<div class="layout rev">${col}${img}</div>` : `<div class="layout">${img}${col}</div>`;
  return `<section class="slide content-slide">${head}${lead}${layout}</section>`;
}
const deck=document.getElementById('deck');
slides.forEach(s=>deck.insertAdjacentHTML('beforeend',renderSlide(s)));
const slideEls=[...document.querySelectorAll('.slide')];
const dots=document.getElementById('dots');
slideEls.forEach((_,i)=>{const d=document.createElement('span');d.className='dot';d.onclick=()=>go(i);dots.appendChild(d);});
let cur=0;
function go(i){cur=Math.max(0,Math.min(slideEls.length-1,i));slideEls.forEach((el,idx)=>{el.classList.toggle('active',idx===cur);el.classList.toggle('prev',idx<cur);});document.getElementById('progress').style.width=((cur+1)/slideEls.length*100)+'%';document.getElementById('cnum').textContent=(cur+1)+' / '+slideEls.length;[...dots.children].forEach((d,idx)=>d.classList.toggle('on',idx===cur));document.getElementById('prev').disabled=cur===0;document.getElementById('next').disabled=cur===slideEls.length-1;const a=slideEls[cur];if(a)a.scrollTop=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(cur+1);}if(e.key==='ArrowLeft'){e.preventDefault();go(cur-1);}if(e.key==='Home')go(0);if(e.key==='End')go(slideEls.length-1);});
let tx=0;deck.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
deck.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>60)go(cur+(dx<0?1:-1));},{passive:true});
document.getElementById('theme').onclick=()=>{const r=document.documentElement;const c=r.getAttribute('data-theme');r.setAttribute('data-theme',c==='dark'?'light':'dark');};
go(0);
</script>
